---
# Keep pacman's mirror list fresh with the reflector package's own weekly timer
- name: Ensure reflector is present
  become: true
  community.general.pacman:
    name: reflector

- name: Ensure reflector options are present
  become: true
  ansible.builtin.template:
    src: reflector.conf.j2
    dest: /etc/xdg/reflector/reflector.conf
    mode: "0644"

- name: Ensure weekly mirror list update is enabled
  become: true
  ansible.builtin.systemd_service:
    name: reflector.timer
    enabled: true
    state: started
